cycle:
  interval: "every-2-days"
  start_date: "2026-05-10"
  time: "02:30"  # UTC (09:30 WIB)

notifications:
  email:
    enabled: true
    provider: "smtp"
    from: "linkedin-automation@example.com"
    to: "${EMAIL_TO}"
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

github:
  create_new_repo_per_project: true
  repo_visibility: "public"
  repo_prefix: "project"
  token: "${GH_TOKEN}"

linkedin:
  manual_post: true
  hashtags: ["#ITSupport", "#Linux", "#Automation", "#DevOps", "#Cloud", "#JobSearch"]

ai:
  provider: "9router"
  base_url: "${AI_BASE_URL}"
  api_key: "${AI_API_KEY}"
  model: "${AI_MODEL}"
  max_projects: 3
  tone: "professional-mix"
