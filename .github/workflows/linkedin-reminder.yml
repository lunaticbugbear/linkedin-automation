name: LinkedIn Automation Reminder

on:
  schedule:
    # Every 2 days at 01:50 UTC (08:50 WIB), 10 minutes before project selection
    - cron: '50 1 */2 * *'
  workflow_dispatch:

jobs:
  remind-9router:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          message = (
              "Reminder: LinkedIn project selection starts in 10 minutes at 09:00 WIB.\n\n"
              "Please turn on your laptop, keep 9Router running, and make sure the self-hosted runner is online."
          )

          response = requests.post(
              f"https://api.telegram.org/bot{bot_token}/sendMessage",
              data={"chat_id": chat_id, "text": message},
              timeout=30,
          )
          response.raise_for_status()
          PY
